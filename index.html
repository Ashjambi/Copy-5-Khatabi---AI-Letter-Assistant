
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khatabi | خطابي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
          --primary-color: #6366f1; 
          --primary-rgb: 99, 102, 241;
          --glass-border: rgba(255, 255, 255, 0.05);
          --glass-surface: rgba(15, 23, 42, 0.6);
      }

      body {
        font-family: 'Cairo', sans-serif;
        color: #f1f5f9; /* slate-100 */
        background-color: #020617;
        background-image: 
            radial-gradient(circle at 10% 20%, rgba(var(--primary-rgb), 0.08) 0%, transparent 40%), 
            linear-gradient(180deg, #020617 0%, #0f172a 100%);
        background-attachment: fixed;
        min-height: 100vh;
        font-weight: 400;
        letter-spacing: -0.01em;
      }

      .prose {
        text-align: right;
        color: #334155; /* slate-700 for light background (paper) */
        font-weight: 500;
        font-size: 1rem;
        line-height: 1.7;
      }
      
      .glass-card {
          background: var(--glass-surface);
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          border: 1px solid var(--glass-border);
          box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
          border-radius: 1rem;
          transition: all 0.3s ease;
      }
      
      .btn-3d {
          border-radius: 0.75rem;
          font-weight: 600;
          transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .btn-3d:hover {
          transform: translateY(-1px);
          filter: brightness(1.1);
          box-shadow: 0 8px 15px -3px rgba(var(--primary-rgb), 0.3);
      }

      .input-inset {
          border-radius: 0.6rem;
          border: 1px solid rgba(255, 255, 255, 0.1);
          background-color: rgba(0, 0, 0, 0.2);
          color: #fff;
          font-weight: 500;
          font-size: 0.9rem;
      }
      
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(var(--primary-rgb), 0.2); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(var(--primary-rgb), 0.4); }

      @media print {
        #print-root { display: block !important; }
        body > #root { display: none !important; }
        .no-print { display: none !important; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.1",
    "react-dom": "https://esm.sh/react-dom@^19.1.1",
    "react-dom/": "https://esm.sh/react-dom@^19.1.1/",
    "react/": "https://esm.sh/react@^19.1.1/",
    "@google/genai": "https://esm.sh/@google/genai@^1.12.0",
    "recharts": "https://esm.sh/recharts@^3.1.0",
    "react-hot-toast": "https://esm.sh/react-hot-toast@^2.5.2",
    "tiff.js": "https://esm.sh/tiff.js@1.0.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <div id="print-root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
